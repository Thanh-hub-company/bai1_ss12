server:
  port: 8081

spring:
  application:
    name: product-service

  # Cấu hình kết nối Redis (Cache, Redisson & Pub/Sub)
  data:
    redis:
      host: localhost
      port: 6379

  # Cấu hình H2 Database cho Product
  datasource:
    url: jdbc:h2:mem:productdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true